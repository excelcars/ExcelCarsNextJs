services:
  web:
    build:
      context: .
      target: dev
    container_name: excelcars-web
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://excelcars:excelcars@db:5432/excelcars
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      target: dev
    container_name: excelcars-worker
    command: npm run worker:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://excelcars:excelcars@db:5432/excelcars
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    container_name: excelcars-db
    environment:
      POSTGRES_DB: excelcars
      POSTGRES_USER: excelcars
      POSTGRES_PASSWORD: excelcars
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: excelcars-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:4
    container_name: excelcars-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

services:
  web:
    build:
      context: .
      target: dev
    container_name: excelcars-web
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://excelcars:excelcars@db:5432/excelcars
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      target: dev
    container_name: excelcars-worker
    command: npm run worker:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://excelcars:excelcars@db:5432/excelcars
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    container_name: excelcars-db
    environment:
      POSTGRES_DB: excelcars
      POSTGRES_USER: excelcars
      POSTGRES_PASSWORD: excelcars
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: excelcars-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
